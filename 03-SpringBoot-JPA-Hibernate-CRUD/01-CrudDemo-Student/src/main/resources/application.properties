spring.application.name=CrudDemo
spring.datasource.url= jdbc:mysql://localhost:3306/student_tracker
spring.datasource.username = springstudent
spring.datasource.password = springstudent

# turn off the springboot banner
spring.main.banner-mode = off

# reduce logging level. set logging level to warn
logging.level.root =warn

#adding logging config to display SQL statements
logging.level.org.hibernate.SQL = debug
logging.level.org.hibernate.orm.jdbc.bind = trace

#creating our own database table if it exists already it will drop and create a new table everytime we run our app
#spring.jpa.hibernate.ddl-auto=create
#Keeps the previous data (update)
spring.jpa.hibernate.ddl-auto=update